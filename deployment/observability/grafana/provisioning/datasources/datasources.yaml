# Grafana datasource provisioning - PathVeer Phase 33.2.
# Prometheus (metrics) and Tempo (traces). No dashboards are provisioned yet;
# dashboard JSON arrives in Phase 33.3.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: pathveer-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Tempo
    uid: pathveer-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      # Trace -> metrics correlation uses service.name only; no
      # high-cardinality attribute is referenced.
      tracesToMetrics:
        datasourceUid: pathveer-prometheus
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: pathveer-prometheus
