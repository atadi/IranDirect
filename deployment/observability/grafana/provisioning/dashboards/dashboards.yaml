# Grafana dashboard provisioning - IranDirect Phase 33.2.
#
# PLACEHOLDER. The provider is declared so that dropping dashboard JSON into
# ./dashboards/ is picked up without a compose change, but NO dashboards are
# shipped in this phase. Dashboards are Phase 33.3.

apiVersion: 1

providers:
  - name: irandirect
    orgId: 1
    folder: IranDirect
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
