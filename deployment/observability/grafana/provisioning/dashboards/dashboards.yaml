# Grafana dashboard provisioning - IranDirect Phase 33.3.
#
# Loads the five version-controlled dashboards from /var/lib/grafana/dashboards
# (mounted read-only from ./grafana/dashboards by docker-compose.yml). No
# manual import is required and no dashboard is editable in the UI: the JSON in
# this repository is the single source of truth.

apiVersion: 1

providers:
  - name: IranDirect
    orgId: 1
    folder: IranDirect
    type: file
    # Dashboards removed from disk are removed from Grafana too, so a deleted
    # file cannot linger as an orphaned dashboard.
    disableDeletion: false
    # UI edits are rejected: change the JSON in git instead.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
