# Alertmanager — PRODUCTION example (Phase 33.5).
#
# Placeholder-only. DO NOT deploy as-is. Render this file at deploy time:
#   1. Set the ALERTMANAGER_* environment variables in .env.production (ignored).
#   2. Render with envsubst into a git-ignored secrets/ file:
#        envsubst < alertmanager.production.example.yml > ../../secrets/alertmanager.production.yml
#   3. Mount that rendered file read-only (see docker-compose.production.yml).
#
# Alertmanager does NOT expand ${VAR} from the process environment by itself;
# the rendered file must contain literal (secret) values. Keep the rendered
# file in secrets/ (git-ignored) — never commit it.
#
# Routing model:
#   * root → severity sub-routes (same grouping as local).
#   * critical → PagerDuty (immediate) + email (for the record).
#   * warning → webhook (Slack/Teams/custom) grouped.
#   * info → null (UI only).
#   * resolved notifications sent for critical.
#   * inhibition from Phase 33.4 retained (collector down suppresses app alerts,
#     critical suppresses warning, target-down suppresses derivatives).

route:
  receiver: "null"
  group_by: ["alertname", "deployment_environment_name", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: "pagerduty-critical"
      repeat_interval: 1h
      continue: false
    - matchers:
        - severity = "warning"
      receiver: "webhook-warning"
    - matchers:
        - severity = "info"
      receiver: "null"

inhibit_rules:
  - source_matchers:
      - alertname = "PathVeerCollectorUnavailable"
    target_matchers:
      - component = "service"
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
  - source_matchers:
      - alertname = "PathVeerPrometheusTargetDown"
    target_matchers:
      - component = "infrastructure"

receivers:
  - name: "null"

  - name: "pagerduty-critical"
    pagerduty_configs:
      - routing_key: "${ALERTMANAGER_PAGERDUTY_ROUTING_KEY}"
        severity: critical
        send_resolved: true

  - name: "webhook-warning"
    webhook_configs:
      - url: "${ALERTMANAGER_WEBHOOK_URL}"
        send_resolved: true

  - name: "email-admins"
    email_configs:
      - smarthost: "${ALERTMANAGER_SMTP_SMARTHOST}"
        from: "${ALERTMANAGER_SMTP_FROM}"
        to: "${ALERTMANAGER_EMAIL_TO}"
        auth_username: "${ALERTMANAGER_SMTP_USERNAME}"
        auth_password: "${ALERTMANAGER_SMTP_PASSWORD}"
        send_resolved: true

# Notification template lives in templates/default.tmpl (committed, no secrets).
templates:
  - /etc/alertmanager/templates/default.tmpl
