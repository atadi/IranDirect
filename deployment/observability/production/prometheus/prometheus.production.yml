# Prometheus — PRODUCTION config (Phase 33.5).
#
# Mounted by docker-compose.production.yml (overrides the base prometheus.yml).
# Self-contained: it re-declares the collector scrape + alertmanager target so
# the base file is not edited. Adds node-exporter scraping and loads the
# production host/storage alert rules in addition to the base recording +
# application alert rules.
#
# Retention: 30d time cap AND 40GB size cap (see overlay command). Eviction
# triggers on whichever limit is hit first.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: irandirect-production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml                       # base: recording + app alerts
  - /etc/prometheus/production-rules/*.yml            # production: host/storage alerts

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Backend self-health (internal only). Alerts fire if any goes down.
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: grafana
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
