# Prometheus configuration - IranDirect Phase 33.2/33.3, extended in Phase 33.4.
#
# Scrapes the OpenTelemetry Collector's prometheus exporter. No remote write.
# Phase 33.3 adds recording rules; Phase 33.4 adds alert rules and wires
# Alertmanager (the fifth stack service) as the alert receiver.
#
# Retention (30 days) is set on the command line in docker-compose.yml via
# --storage.tsdb.retention.time=30d; it is not a config-file setting.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: irandirect-local

# Phase 33.4: send firing alerts to Alertmanager over the internal network.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # IranDirect application telemetry, republished by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          job_source: irandirect-service

  # Prometheus' own metrics - lets operators verify scrape health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Phase 33.4 infra scrape jobs. These back the infrastructure alerts
  # (Tempo/Grafana/Alertmanager availability). All endpoints are internal to
  # the stack network - nothing is published to the host.
  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          component: tempo

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: grafana

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          component: alertmanager
